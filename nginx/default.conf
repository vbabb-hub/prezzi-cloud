# Cache: sempre da rivalidare (ETag), così i dati giornalieri e il service worker non restano vecchi.
map $uri $cache_control {
    default        "no-cache";
    ~^/icon\.svg$  "public, max-age=86400";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Sito di sola lettura
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location ~ /\. {
        return 404;
    }

    # Il manifest della PWA deve uscire come application/manifest+json (non tutte le versioni di mime.types lo conoscono)
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        include /etc/nginx/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ =404;
        include /etc/nginx/security-headers.conf;
    }
}
