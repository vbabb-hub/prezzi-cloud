name: Aggiorna prezzi
on:
  schedule: [{cron: "17 4 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python collectors/run.py
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          GCP_API_KEY: ${{ secrets.GCP_API_KEY }}
      - name: Commit
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add -A docs/data
          git diff --cached --quiet || (git commit -m "Prezzi $(date -u +%F)" && git push)
