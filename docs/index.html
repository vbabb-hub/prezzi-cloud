<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prezzi cloud</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#2c4fd6">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside id="side" aria-label="Provider">
    <div class="brand"><b>Prezzi cloud</b><span id="meta">Caricamento…</span></div>
    <button type="button" class="pi home" data-v="compare"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 4h14v3H3zM3 9h14v3H3zM3 14h9v3H3z"/></svg><span>Confronto</span></button>
    <nav id="provs"></nav>
    <details class="stat"><summary>Stato delle fonti</summary><div id="status"></div></details>
  </aside>
  <div id="scrim"></div>
  <main>
    <header class="top">
      <button type="button" id="burger" aria-label="Apri l'elenco dei provider"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/></svg></button>
      <h1 id="title">Confronto</h1>
      <button type="button" id="csv">Esporta CSV</button>
    </header>
    <div id="view"></div>
  </main>
</div>
<dialog id="dlg"></dialog>
<script src="app.js"></script>
</body>
</html>
