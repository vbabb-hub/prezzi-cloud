<!DOCTYPE html>
<html lang="it" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prezzi Cloud - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="h-full flex flex-col font-sans antialiased" x-data="cloudApp()">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2 rounded-xl font-bold">☁️</div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight">Prezzi Cloud</h1>
                    <p class="text-xs text-slate-400" x-text="'Aggiornato al ' + (updatedDate || 'N/D')"></p>
                </div>
            </div>
            <button @click="exportCSV()" class="px-3 py-1.5 border border-slate-700 text-xs font-medium rounded-lg text-slate-300 bg-slate-800 hover:bg-slate-700 transition">
                📥 Esporta CSV
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col gap-6">

        <!-- Pannello Filtri -->
        <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 shadow-xl flex flex-col gap-4">
            
            <!-- Categorie -->
            <div class="flex flex-wrap gap-2 items-center">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider mr-2">Categoria:</span>
                <template x-for="cat in categories" :key="cat.id">
                    <button @click="selectedCategory = cat.id"
                        :class="selectedCategory === cat.id ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'"
                        class="px-3 py-1.5 rounded-xl text-xs font-medium transition cursor-pointer"
                        x-text="cat.name">
                    </button>
                </template>
            </div>

            <!-- Impegni -->
            <div class="flex flex-wrap gap-2 items-center border-t border-slate-800/80 pt-3">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider mr-2">Impegno:</span>
                <template x-for="t in terms" :key="t.id">
                    <button @click="selectedTerm = t.id"
                        :class="selectedTerm === t.id ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-600/30' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'"
                        class="px-3 py-1.5 rounded-xl text-xs font-medium transition cursor-pointer"
                        x-text="t.name">
                    </button>
                </template>
            </div>
        </div>

        <!-- Filtro vCPU (Visibile solo se compute) -->
        <div x-show="selectedCategory === 'compute'" class="flex flex-wrap items-center gap-2 bg-slate-900/40 p-3 rounded-xl border border-slate-800">
            <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider mr-2">Taglia vCPU:</span>
            <button @click="selectedVcpu = 'all'" :class="selectedVcpu === 'all' ? 'bg-slate-700 text-white' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'" class="px-2.5 py-1 rounded-lg text-xs font-medium transition">Tutte</button>
            <template x-for="v in [1, 2, 4, 8, 16, 32, 64]" :key="v">
                <button @click="selectedVcpu = v" :class="selectedVcpu === v ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'" class="px-2.5 py-1 rounded-lg text-xs font-medium transition" x-text="v + ' vCPU'"></button>
            </template>
        </div>

        <!-- Tabella -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden flex-1 flex flex-col">
            <div class="px-6 py-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/50">
                <h3 class="font-semibold text-sm text-slate-200" x-text="categoryTitle()"></h3>
                <span class="text-xs text-slate-400" x-text="filteredRecords.length + ' risultati trovati'"></span>
            </div>

            <div class="overflow-x-auto flex-1">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="
