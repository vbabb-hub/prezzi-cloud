<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prezzi Cloud - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans" x-data="cloudApp()">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <span class="text-2xl">☁️</span>
            <div>
                <h1 class="text-lg font-bold">Prezzi Cloud</h1>
                <p class="text-xs text-slate-400">Dashboard Comparativa</p>
            </div>
        </div>
        <button @click="exportCSV()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-lg shadow transition">
            📥 Esporta CSV
        </button>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl w-full mx-auto p-6 flex flex-col gap-6 flex-1">

        <!-- Filtri Principali -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col gap-4">
            
            <!-- Categorie -->
            <div>
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">Categoria:</span>
                <div class="flex flex-wrap gap-2">
                    <template x-for="cat in categories" :key="cat.id">
                        <button @click="selectedCategory = cat.id"
                            :class="selectedCategory === cat.id ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'"
                            class="px-3.5 py-2 rounded-xl text-xs font-semibold transition cursor-pointer"
                            x-text="cat.name">
                        </button>
                    </template>
                </div>
            </div>

            <!-- Impegni -->
            <div class="border-t border-slate-800 pt-4">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">Termine / Impegno:</span>
                <div class="flex flex-wrap gap-2">
                    <template x-for="t in terms" :key="t.id">
                        <button @click="selectedTerm = t.id"
                            :class="selectedTerm === t.id ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-600/30' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'"
                            class="px-3.5 py-2 rounded-xl
