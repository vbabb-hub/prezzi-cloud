<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prezzi Cloud - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <span class="text-2xl">☁️</span>
            <div>
                <h1 class="text-lg font-bold">Prezzi Cloud</h1>
                <p class="text-xs text-slate-400" id="update-info">Caricamento in corso...</p>
            </div>
        </div>
        <button onclick="esportaCSV()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-lg shadow transition cursor-pointer">
            📥 Esporta CSV
        </button>
    </header>

    <!-- Layout Principale con Sidebar e Contenuto -->
    <div class="max-w-7xl w-full mx-auto p-6 flex flex-col lg:flex-row gap-6 flex-1">

        <!-- Sidebar Sinistra: Provider -->
        <aside class="w-full lg:w-72 flex flex-col gap-4">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Provider</h2>
                <div class="flex flex-col gap-1 max-h-[calc(100vh-250px)] overflow-y-auto pr-1" id="provider-list">
                    <!-- Generato via JS -->
                </div>
            </div>
        </aside>

        <!-- Contenuto Centrale -->
        <main class="flex-1 flex flex-col gap-6">

            <!-- Pannello Filtri (Categorie & Termini) -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col gap-4">
                
                <!-- Categorie -->
                <div>
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">Categoria:</span>
                    <div class="flex flex-wrap gap-2" id="category-buttons"></div>
                </div>

                <!-- Impegni -->
                <div class="border-t border-slate-800 pt-4">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">Termine / Impegno:</span>
                    <div class="flex flex-wrap gap-2" id="term-buttons"></div>
                </div>
            </div>

            <!-- Tabella Risultati -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-xl overflow-hidden flex-1 flex flex-col">
                <div class="px-6 py-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/50">
                    <h3 class="font-bold text-sm text-slate-200" id="table-title">Listino Compute</h3>
                    <span class="text-xs text-slate-400 font-medium" id="result-count">0 elementi trovati</span>
                </div>

                <div class="overflow-x-auto flex-1">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-800 bg-slate-950/70 text-xs font-bold text-slate-400 uppercase tracking-wider cursor-pointer select-none">
                                <th class="py-3.5 px-4 hover:text-indigo-400 transition" onclick="sortData('provider')">Provider ↕</th>
                                <th class="py-3.5 px-4 hover:text-indigo-400 transition" onclick="sortData('sku')">SKU / Servizio ↕</th>
                                <th class="py-3.5 px-4 hover:text-indigo-400 transition" onclick="sortData('region')">Regione ↕</th>
                                <th class="py-3.5 px-4" id="th-vcpu" onclick="sortData('vcpu')">vCPU / RAM ↕</th>
                                <th class="py-3.5 px-4 hover:text-indigo-400 transition" onclick="sortData('term')">Impegno ↕</th>
                                <th class="py-3.5 px-4 text-right hover:text-indigo-400 transition" onclick="sortData('price')">Prezzo ↕</th>
                                <th class="py-3.5 px-4">Fonte</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-800 text-sm" id="table-body">
                            <tr>
                                <td colspan="7" class="py-16 text-center text-slate-500 text-sm font-medium">Caricamento dati in corso...</td>
                            </tr>
                        </tbody>
                    </table>
