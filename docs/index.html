<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prezzi Cloud | Confronto e Monitoraggio</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="app">
    <!-- Sidebar / Navigazione -->
    <aside id="side">
      <div class="brand">
        <b>Prezzi cloud</b>
        <span id="meta">Caricamento dati...</span>
      </div>

      <button type="button" class="pi home" data-v="compare" aria-current="true">
        <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8v-10h-8v10zm0-18v6h8V3h-8z"/></svg>
        <span>Confronto</span>
      </button>

      <div id="provs">
        <!-- Popolato dinamicamente da app.js -->
      </div>

      <details class="stat">
        <summary>Stato fonti</summary>
        <div id="status"></div>
      </details>
      <div class="ver" id="ver">Interfaccia PWA</div>
    </aside>

    <!-- Overlay per mobile -->
    <div id="scrim"></div>

    <!-- Area Contenuti Principale -->
    <main>
      <header class="top">
        <button id="burger" aria-label="Apri menu">
          <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
        </button>
        <h1 id="title">Confronto prezzi</h1>
        <button id="csv" type="button">Esporta CSV</button>
      </header>

      <!-- Vista Dinamica (Matrice o Provider) -->
      <section id="view">
        <p class="empty">Caricamento in corso...</p>
      </section>
    </main>
  </div>

  <!-- Dialog per Storico/Dettagli -->
  <dialog id="dlg"></dialog>

  <script src="app.js"></script>
</body>
</html>
